# Strict lint rules. Never lower a limit or turn off a rule to get a pass; if a rule
# looks wrong, ask, and change it through an ADR and a template update.
target-version = "py315"

[format]
docstring-code-format = true

[lint]
select = [
    "E", "W", "F",  # pycodestyle and pyflakes: errors
    "B",            # bugs
    "SIM",          # simplifications
    "UP",           # modern syntax
    "I",            # import order
    "PL",           # pylint
    "S",            # security
    "PT",           # pytest style
    "C90",          # complexity
    "RUF",          # ruff's own checks, including unused noqa comments
    "PLR1702",      # nesting depth (preview rule)
]
preview = true
explicit-preview-rules = true

[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-args = 5
max-nested-blocks = 4
max-statements = 50

[lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
